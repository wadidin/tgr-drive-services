app = 'tgr-drive-backend'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '8080'
  CORS_ORIGIN = 'https://tgr-drive-app.netlify.app'
  GOOGLE_DEFAULT_FOLDER_ID = '1KiXQuXQwrk_geD5gvAYRRDjIzHrL9mma'
  GOOGLE_REDIRECT_URI = 'https://tgr-drive-backend.fly.dev/api/admin/drive/oauth-callback'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    grace_period = '15s'
    interval = '30s'
    method = 'GET'
    timeout = '5s'
    path = '/api/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
